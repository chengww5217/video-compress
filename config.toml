[tools]
ffmpeg = ""
ffprobe = ""

[skip]
min_size_mb = 20
min_saving_ratio = 0.15
extensions = [".mp4", ".mkv", ".mov", ".avi", ".webm", ".ts", ".m4v", ".flv", ".wmv", ".mpg", ".mpeg"]
tag_marker = "vcompress"

[skip.bpp]
h264 = 0.05
hevc = 0.03
vp9 = 0.03
av1 = 0.02
mpeg2video = 0.12
mpeg4 = 0.08

[skip.expected_ratio]
h264 = 0.55
hevc = 0.78
vp9 = 0.80
av1 = 0.92
mpeg2video = 0.40
mpeg4 = 0.45
flv1 = 0.45
wmv3 = 0.50

[encode]
encoder = "av1"
output_container = ".mkv"

[encode.av1]
codec = "libsvtav1"
preset = "2"
crf = 28
extra = "-svtav1-params tune=0:film-grain-denoise=0"

[encode.x265]
codec = "libx265"
preset = "placebo"
crf = 20
extra = "-x265-params aq-mode=3:psy-rd=2.0"

[adaptive]
enabled = true
target_vmaf = 95.0
crf_min = 16
crf_max = 44
sample_seconds = 30
search_step = 2

[audio]
transcode_over_kbps = 512
opus_kbps = 160

[verify]
decode_check = true
max_duration_diff_s = 0.5
min_actual_saving = 0.05
vmaf_enabled = true
vmaf_segments = 3
vmaf_sample_seconds = 20
vmaf_threshold = 93.0
keep_failed_output = false

[run]
workers = 1
results_file = "logs/results.jsonl"
log_file = "logs/vcompress.log"
log_max_bytes = 5242880
log_backups = 3
use_recycle_bin = false
keep_original = false
